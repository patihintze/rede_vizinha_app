name: rede_vizinha_app
description: "A new Flutter project."
publish_to: "none"
version: 0.1.0

environment:
  sdk: ^3.7.2

dependencies:
  flutter:
    sdk: flutter
  get: ^4.6.5
  firebase_core: ^4.1.1
  firebase_auth: ^6.1.0
  cloud_firestore: ^6.0.0
  http: ^1.5.0
  flutter_multi_formatter: ^2.1.0
  flutter_svg: ^2.0.9
  url_launcher: ^6.3.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true

  assets:
    - assets/fonts/Edu/
    - assets/fonts/Roboto/
    - assets/fonts/Tektur/
    - assets/images/

  fonts:
    - family: Roboto
      fonts:
        - asset: assets/fonts/Roboto/Roboto-Regular.ttf
        - asset: assets/fonts/Roboto/Roboto-Bold.ttf
          weight: 700

    - family: Edu
      fonts:
        - asset: assets/fonts/Edu/EduTASBeginner-Regular.ttf
        - asset: assets/fonts/Edu/EduTASBeginner-Bold.ttf
          weight: 700

    - family: Tektur
      fonts:
        - asset: assets/fonts/Tektur/Tektur-Regular.ttf
        - asset: assets/fonts/Tektur/Tektur-Bold.ttf
          weight: 700
